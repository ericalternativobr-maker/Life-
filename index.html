<html lang="pt-BR"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Life+"><meta name="theme-color" content="#141218"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">

<style>

:root[data-theme=dark]{--p:#D0BCFF;--op:#381E72;--pc:#4F378B;--opc:#EADDFF;--sc:#4A4458;--s:#141218;--os:#E6E0E9;--sv:#49454F;--osv:#CAC4D0;--ol:#938F99;--er:#F2B8B5;--c:#211F26;--ok:#A8DB8F;--ov:#49454F;--osc:#E8DEF8}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--s);color:var(--os);font:400 14px/20px Roboto,system-ui,sans-serif;letter-spacing:.25px;display:flex;justify-content:center}
#app{width:100%;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
h1{font:400 28px/36px Roboto,system-ui;margin:0}h2{font:500 16px/24px Roboto,system-ui;letter-spacing:.15px;margin:0 0 8px}
main{flex:1;overflow-y:auto;padding:8px 16px 20px}
nav{display:flex;background:var(--c);padding:12px 8px 16px}
nav button{flex:1;background:none;border:0;color:var(--osv);font:500 12px/16px Roboto,system-ui;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button i{font-style:normal;font-size:18px;padding:4px 0;width:64px;text-align:center;border-radius:16px}
nav button.on{color:var(--os)}nav button.on i{background:var(--sc)}
.card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{border:1px solid var(--ov);background:none;color:var(--osv);border-radius:8px;height:32px;padding:0 16px;font:500 14px/20px Roboto,system-ui;letter-spacing:.1px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sc);color:var(--osc);border-color:var(--sc)}
.btn{background:var(--p);color:var(--op);border:0;border-radius:20px;height:40px;padding:0 24px;font:500 14px/20px Roboto,system-ui;letter-spacing:.1px;cursor:pointer}
.btn.t{background:none;color:var(--p);padding:8px 12px}
input,select{background:var(--sv);color:var(--os);border:0;border-bottom:2px solid var(--ol);border-radius:4px 4px 0 0;padding:12px 16px;min-height:48px;font:400 16px/24px Roboto,system-ui;letter-spacing:.5px;width:100%;min-width:0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.set{display:grid;grid-template-columns:24px 1fr 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--ol);background:none;color:var(--op);cursor:pointer}
.ck.on{background:var(--p);border-color:var(--p)}
.mut{color:var(--osv);font-size:12px}.big{font:400 28px/36px Roboto,system-ui}
.ok{color:var(--ok)}.bad{color:var(--er)}
table{width:100%;border-collapse:collapse}td,th{padding:12px 4px;border-bottom:1px solid var(--ov);text-align:left}th{font:500 12px system-ui;color:var(--osv)}td:last-child,th:last-child{text-align:right}
.bar{height:8px;background:var(--sv);border-radius:4px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--p)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lb{font-size:12px;color:var(--osv);display:block;margin:8px 0 2px}
.sc{border:2px solid transparent;cursor:pointer}.sc.on{border-color:var(--p);background:var(--pc);color:var(--opc)}
.x{background:none;border:0;color:var(--er);font-size:18px;cursor:pointer}
</style></head><body><div id="splash"><svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B69DF8"/><stop offset="1" stop-color="#6750A4"/></linearGradient></defs><rect x="4" y="4" width="88" height="88" rx="28" fill="url(#lgg)"/><rect x="4.5" y="4.5" width="87" height="87" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".5"/><path d="M18 54h16l8-18 12 34 8-16h16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 18v14M61 25h14" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg><h1>Life+</h1></div><div id="app">
<header><h1 id="ttl"></h1><button class="btn t" onclick="th()">🌓</button></header>
<main id="m"></main>
<nav id="nv"></nav></div>
<script>
const $=s=>document.querySelector(s),N=[['t','🏋️','Treino'],['f','💰','Finanças'],['d','🥗','Dieta'],['s','💊','Saúde']];
const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let tab='t',day=new Date().getDay(),cur=0,cex='Supino reto',pick=-1,plan=null,sc=null;
const mk=(n,s,r,h)=>({n,s,r,h,sets:Array.from({length:s},()=>({w:'',r:'',d:0}))});
const W={1:[mk('Supino reto',4,'8-10',[60,62,65,65,67,70]),mk('Crucifixo',3,'12',[14,14,16,16,18,18]),mk('Tríceps corda',3,'12',[25,27,27,30,30,32])],
3:[mk('Agachamento',4,'8',[80,85,85,90,95,100]),mk('Leg press',4,'12',[180,200,200,220,220,240])],
5:[mk('Puxada frente',4,'10',[50,52,55,55,57,60]),mk('Remada curvada',4,'10',[40,42,45,45,47,50]),mk('Rosca direta',3,'12',[20,20,22,22,24,24])]};
const F=[{n:'Salário',v:6500,a:-99,b:null},{n:'Freelance',v:800,a:0,b:0},{n:'Aluguel',v:-1800,a:-99,b:null},{n:'Cartão de crédito',v:-1250,a:-99,b:null},{n:'Parcela notebook',v:-350,a:-4,b:3},{n:'Internet',v:-120,a:-99,b:null},{n:'Academia',v:-110,a:-99,b:null}];
let BANK=4200;
const P={sexo:'M',peso:80,altura:178,idade:30,obj:'perder',ativ:1.55};
const MED=[{n:'Amoxicilina 500mg',h:'8h · 16h · 24h',total:21,taken:12},{n:'Vitamina D 2000UI',h:'Manhã',total:60,taken:41},{n:'Omeprazol 20mg',h:'Jejum',total:14,taken:3}];
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function th(){const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const c=r.dataset.theme||(d?'dark':'light');r.dataset.theme=c=='dark'?'light':'dark'}
function go(t){tab=t;R()}
function R(){$('#nv').innerHTML=N.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
$('#ttl').textContent=N.find(n=>n[0]==tab)[2];$('#m').innerHTML={t:vT,f:vF,d:vD,s:vS}[tab]()}
/* TREINO */
function vT(){const L=W[day]||[],all=Object.values(W).flat();
const vol=L.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.d?(+s.w||0)*(+s.r||0):0),0),0);
const ex=all.find(e=>e.n==cex)||all[0],h=ex?ex.h:[],mx=Math.max(...h,1),mn=Math.min(...h,0);
const pts=h.map((v,i)=>`${20+i*(260/Math.max(h.length-1,1))},${100-(v-mn)/(mx-mn||1)*80}`).join(' ');
return `<div class="chips">${DN.map((d,i)=>`<button class="chip ${i==day?'on':''}" onclick="day=${i};R()">${d}${i==new Date().getDay()?' •':''}</button>`).join('')}</div>
${L.length?`<div class="card"><div class="row sp"><h2>Treino de ${DN[day]}</h2><span class="mut">Volume ${vol} kg</span></div>
${L.map((e,i)=>`<div style="margin-top:12px"><b>${e.n}</b> <span class="mut">${e.s}×${e.r} · última ${e.h.at(-1)} kg</span>
${e.sets.map((s,j)=>`<div class="set"><span class="mut">${j+1}</span><input type="number" placeholder="kg" value="${s.w}" oninput="W[day][${i}].sets[${j}].w=this.value"><input type="number" placeholder="reps" value="${s.r}" oninput="W[day][${i}].sets[${j}].r=this.value"><button class="ck ${s.d?'on':''}" onclick="W[day][${i}].sets[${j}].d^=1;R()">✓</button></div>`).join('')}</div>`).join('')}</div>`
:`<div class="card"><h2>Descanso 😴</h2><p class="mut">Nenhum treino em ${DN[day]}. Adicione abaixo.</p></div>`}
<div class="card"><div class="row sp"><h2>Evolução de cargas</h2><select style="width:60%" onchange="cex=this.value;R()">${all.map(e=>`<option ${e.n==cex?'selected':''}>${e.n}</option>`).join('')}</select></div>
${ex?`<svg viewBox="0 0 300 120" width="100%"><polyline points="${pts}" fill="none" stroke="var(--p)" stroke-width="3"/>${pts.split(' ').map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="var(--p)"/>`).join('')}</svg>
<div class="mut">${h[0]} kg → <b class="ok">${h.at(-1)} kg (+${h.at(-1)-h[0]} kg)</b> em ${h.length} treinos</div>`:''}</div>
<div class="card"><h2>Gerenciar treino de ${DN[day]}</h2>
${L.map((e,i)=>`<div class="row sp"><span>${e.n} · ${e.s}×${e.r}</span><button class="x" onclick="W[day].splice(${i},1);R()">✕</button></div>`).join('')}
<div class="row" style="margin-top:10px"><input id="en" placeholder="Novo exercício"><input id="es" type="number" placeholder="Séries" style="width:90px"></div>
<button class="btn" style="margin-top:10px" onclick="addE()">Adicionar</button></div>`}
function addE(){const n=$('#en').value.trim();if(!n)return;(W[day]=W[day]||[]).push(mk(n,+$('#es').value||3,'10',[0]));R()}
/* FINANÇAS */
function vF(){const on=F.filter(f=>cur>=f.a&&(f.b==null||cur<=f.b)),i=on.filter(f=>f.v>0).reduce((a,f)=>a+f.v,0),o=on.filter(f=>f.v<0).reduce((a,f)=>a+f.v,0),r=i+o;
let acc=BANK;for(let k=0;k<=cur;k++)acc+=F.filter(f=>k>=f.a&&(f.b==null||k<=f.b)).reduce((a,f)=>a+f.v,0);
const d=new Date(2026,9+cur,1),lbl=MN[d.getMonth()]+'/'+d.getFullYear();
return `<div class="card"><div class="mut">Total em banco hoje</div><div class="big">${brl(BANK)}</div><div class="mut">Salário a receber: <b>${brl(6500)}</b></div></div>
<div class="row sp" style="margin-bottom:8px"><button class="btn t" onclick="cur--;R()">‹</button><b>${lbl}</b><button class="btn t" onclick="cur++;R()">›</button></div>
<div class="g2"><div class="card"><div class="mut">Entradas</div><b class="ok">${brl(i)}</b></div><div class="card"><div class="mut">Saídas</div><b class="bad">${brl(o)}</b></div></div>
<div class="card" style="background:var(--pc);color:var(--opc)"><div>${r>=0?'Lucro':'Prejuízo'} do mês</div><div class="big ${r>=0?'ok':'bad'}">${brl(r)}</div><div style="font-size:12px">Saldo projetado no fim do mês: <b>${brl(acc)}</b></div></div>
<div class="card"><h2>Contas ativas</h2><table><tr><th>Conta</th><th>Tipo</th><th>Valor</th></tr>${on.map(f=>`<tr><td>${f.n}</td><td class="mut">${f.b==null?'Fixa':'Até '+MN[new Date(2026,9+f.b,1).getMonth()]}</td><td class="${f.v>0?'ok':'bad'}">${brl(f.v)}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Nova conta</h2><div class="row"><input id="fn" placeholder="Nome"><input id="fv" type="number" placeholder="R$"></div>
<div class="row" style="margin-top:8px"><select id="ft"><option value="-1">Saída</option><option value="1">Entrada</option></select><select id="fr"><option>Fixa</option><option>Só este mês</option></select></div>
<button class="btn" style="margin-top:10px" onclick="addF()">Adicionar</button></div>`}
function addF(){const n=$('#fn').value.trim(),v=+$('#fv').value;if(!n||!v)return;const o=$('#fr').value!='Fixa';F.push({n,v:Math.abs(v)*$('#ft').value,a:o?cur:-99,b:o?cur:null});R()}
/* DIETA */
function tdee(){return(10*P.peso+6.25*P.altura-5*P.idade+(P.sexo=='M'?5:-161))*P.ativ}
const SC=[{n:'Déficit leve',f:.85,o:'perder'},{n:'Manutenção',f:1,o:'manter'},{n:'Ganho limpo',f:1.1,o:'ganhar'}];
const ML=[['Café da manhã',.25,'Ovos, pão integral, fruta'],['Lanche',.1,'Iogurte e castanhas'],['Almoço',.3,'Arroz, feijão, frango, salada'],['Pré-treino',.1,'Banana, aveia, whey'],['Jantar',.25,'Carne magra, batata-doce, legumes']];
function vD(){const g=SC.map((s,i)=>{const k=Math.round(tdee()*s.f),p=Math.round(P.peso*2),f=Math.round(k*.25/9);return{...s,i,k,p,f,c:Math.round((k-p*4-f*9)/4)}});
const f=(k,l,t='number')=>`<div><span class="lb">${l}</span><input type="${t}" value="${P[k]}" onchange="P[k]=${t=='number'?'+':''}this.value"></div>`.replace(/\[k\]/g,'['+JSON.stringify(k)+']');
return `<div class="card"><h2>Meus dados</h2><div class="g2">${f('peso','Peso (kg)')}${f('altura','Altura (cm)')}${f('idade','Idade')}
<div><span class="lb">Sexo</span><select onchange="P.sexo=this.value"><option value="M" ${P.sexo=='M'?'selected':''}>Masculino</option><option value="F" ${P.sexo=='F'?'selected':''}>Feminino</option></select></div></div>
<span class="lb">Objetivo</span><select onchange="P.obj=this.value"><option value="perder" ${P.obj=='perder'?'selected':''}>Perder gordura</option><option value="manter" ${P.obj=='manter'?'selected':''}>Manter peso</option><option value="ganhar" ${P.obj=='ganhar'?'selected':''}>Ganhar massa</option></select>
<button class="btn" style="margin-top:12px" onclick="sc=1;plan=null;R()">✨ Gerar cenários com IA</button></div>
${sc?`<h2>Cenários sugeridos</h2>${g.map(s=>`<div class="card sc ${pick==s.i?'on':''}" onclick="pick=${s.i};R()"><div class="row sp"><b>${s.n}</b>${s.o==P.obj?'<span class="mut">⭐ recomendado</span>':''}</div><div class="big">${s.k} kcal</div><div class="mut" style="color:inherit">P ${s.p}g · C ${s.c}g · G ${s.f}g</div></div>`).join('')}
${pick>=0?`<button class="btn" onclick="plan=${pick};R()">Aplicar e registrar dieta</button>`:''}`:''}
${plan!=null?`<div class="card" style="margin-top:12px"><h2>Dieta de hoje · ${g[plan].k} kcal</h2><table>${ML.map((m,i)=>`<tr><td><b>${m[0]}</b><div class="mut">${m[2]}</div></td><td>${Math.round(g[plan].k*m[1])} kcal</td></tr>`).join('')}</table></div>`:''}
${sc?'<p class="mut">IA simulada no mockup (fórmula Mifflin-St Jeor). No app final, entra o modelo real.</p>':''}`}
/* SAÚDE */
function vS(){return MED.map((m,i)=>{const r=m.total-m.taken;return `<div class="card"><div class="row sp"><b>${m.n}</b><span class="mut">${m.h}</span></div>
<div class="big">${r} <span class="mut">doses restantes</span></div><div class="bar"><b style="width:${m.taken/m.total*100}%"></b></div>
<div class="row sp"><span class="mut">${m.taken}/${m.total} · ${r?'~'+Math.ceil(r/(m.h.split('·').length))+' dias para terminar':'Tratamento concluído ✅'}</span>
${r?`<button class="btn" onclick="MED[${i}].taken++;R()">Tomei</button>`:''}</div></div>`}).join('')+`<div class="card"><h2>Novo remédio</h2><input id="mn" placeholder="Nome e dosagem"><div class="row" style="margin-top:8px"><input id="mt" type="number" placeholder="Total de doses"><input id="mh" placeholder="Horários"></div><button class="btn" style="margin-top:10px" onclick="addM()">Adicionar</button></div>`}
function addM(){const n=$('#mn').value.trim(),t=+$('#mt').value;if(!n||!t)return;MED.push({n,h:$('#mh').value||'—',total:t,taken:0});R()}
R();
</script>
<style>

<script>

let SH=null,DT=[],di=0,dnew=true;
const V=id=>$('#'+id).value,q=v=>String(v).replace(/"/g,'&quot;');
const inp=(id,l,v='',t='text')=>`<span class="lb">${l}</span><input id="${id}" type="${t}" ${t=='number'?'inputmode="decimal"':''} value="${q(v)}">`;
const red='style="color:var(--er)"';
function openS(t,h,s){SH={s};$('#sh').innerHTML=`<div class="ov" onclick="closeS()"></div><div class="sheet"><div class="d-flex justify-content-between align-items-center"><h2 style="margin:0">${t}</h2><button class="btn t btn-sm" onclick="closeS()">✕</button></div>${h}<button class="btn" style="width:100%" onclick="SH.s()">Salvar</button></div>`}
function closeS(){SH=null;$('#sh').innerHTML=''}
function add(){({t:()=>exSheet(-1),f:()=>finSheet(-1),s:()=>medSheet(-1)})[tab]()}
const R0=R;R=function(){R0();$('#fab').style.display=tab=='d'?'none':'block'};
/* TREINO */
function exSheet(i){const e=i>=0?W[day][i]:{n:'',s:3,r:'10'};
openS(i>=0?'Editar exercício':'Novo exercício em '+DN[day],inp('xn','Nome',e.n)+`<div class="g2"><div>${inp('xs','Séries',e.s,'number')}</div><div>${inp('xr','Repetições por série',e.r,'number')}</div></div>`+(i>=0?`<button class="btn t dng" style="margin-top:16px" onclick="W[day].splice(${i},1);closeS();R()">Excluir exercício</button>`:''),
()=>{const n=V('xn').trim();if(!n)return;const s=Math.max(1,+V('xs')||3),r=V('xr')||'10';
if(i>=0){const x=W[day][i];x.n=n;x.r=r;while(x.sets.length<s)x.sets.push({w:'',r:'',d:0});x.sets.length=s;x.s=s}else(W[day]=W[day]||[]).push(mk(n,s,r,[0]));closeS();R()})}
const vT1=vT;
vT=()=>{const h=vT1(),a=h.indexOf('<div class="card"><div class="row sp"><h2>Evolução'),b=h.indexOf('<div class="card"><h2>Gerenciar'),L=W[day]||[];
return (L.length?L.map((e,i)=>`<div class="card"><div class="d-flex justify-content-between align-items-center"><div><b>${e.n}</b><div class="mut">${e.s} séries × ${e.r} reps · última ${e.h.at(-1)} kg</div></div><button class="btn t btn-sm" onclick="exSheet(${i})">⋯</button></div>
<div class="set mut"><span>#</span><span>Carga (kg)</span><span>Reps</span><span></span></div>
${e.sets.map((s,j)=>`<div class="set"><span class="mut">${j+1}</span><input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" oninput="W[day][${i}].sets[${j}].w=this.value"><input type="number" inputmode="numeric" placeholder="${e.r}" value="${s.r}" oninput="W[day][${i}].sets[${j}].r=this.value"><button class="ck ${s.d?'on':''}" onclick="W[day][${i}].sets[${j}].d^=1;R()">✓</button></div>`).join('')}</div>`).join(''):`<div class="card"><h2>Descanso</h2><div class="mut">Nenhum treino em ${DN[day]}. Toque no + para adicionar.</div></div>`)+h.slice(a,b)}
/* FINANÇAS */
function finSheet(i){const f=i>=0?F[i]:{n:'',v:0,a:-99,b:null};
openS(i>=0?'Editar conta':'Nova conta',inp('fn','Nome',f.n)+inp('fv','Valor (R$)',Math.abs(f.v)||'','number')+`<span class="lb">Tipo</span><select id="ft"><option value="-1">Saída</option><option value="1" ${f.v>0?'selected':''}>Entrada</option></select><span class="lb">Recorrência</span><select id="fr">${i>=0?'<option value="k">Manter atual</option>':''}<option value="f">Fixa todo mês</option><option value="m">Só este mês</option></select>`+(i>=0?`<button class="btn t dng" style="margin-top:16px" onclick="F.splice(${i},1);closeS();R()">Excluir conta</button>`:''),
()=>{const n=V('fn').trim(),v=Math.abs(+V('fv'));if(!n||!v)return;const o={n,v:v*(+V('ft'))},r=V('fr');
if(r=='m'){o.a=cur;o.b=cur}else if(r=='k'){o.a=f.a;o.b=f.b}else{o.a=-99;o.b=null}
if(i>=0)F[i]=o;else F.push(o);closeS();R()})}
const vF1=vF;
vF=()=>{const h=vF1(),a=h.indexOf('<div class="card"><h2>Contas ativas'),on=F.map((f,i)=>[f,i]).filter(([f])=>cur>=f.a&&(f.b==null||cur<=f.b));
return h.slice(0,a)+`<div class="card"><div class="d-flex justify-content-between align-items-center"><h2 style="margin:0">Contas ativas</h2><button class="btn t btn-sm" onclick="openS('Saldo em banco',inp('bk','Total em banco (R$)',BANK,'number'),()=>{BANK=+V('bk')||0;closeS();R()})">Editar saldo</button></div>
<div class="mut">Toque numa conta para editar ou excluir.</div><table><tr><th>Conta</th><th>Tipo</th><th>Valor</th></tr>${on.map(([f,i])=>`<tr onclick="finSheet(${i})"><td>${f.n}</td><td class="mut">${f.a==f.b?'Só este mês':f.b==null?'Fixa':'Parcelada'}</td><td class="${f.v>0?'ok':'bad'}">${brl(f.v)}</td></tr>`).join('')}</table></div>`}
/* DIETA */
function newD(){dnew=true;sc=null;pick=-1;R()}
function applyD(){DT.push({name:'Dieta '+(DT.length+1),s:gen()[pick],eat:{}});di=DT.length-1;dnew=false;sc=null;pick=-1;R()}
function delD(){DT.splice(di,1);di=0;R()}
function dForm(){const g=gen(),fl=(l,k)=>`<div><span class="lb">${l}</span><input type="number" value="${P[k]}" onchange="P.${k}=+this.value"></div>`;
return `<div class="card"><h2>Nova dieta · seus dados</h2><div class="g2">${fl('Peso (kg)','peso')}${fl('Altura (cm)','altura')}${fl('Idade','idade')}<div><span class="lb">Sexo</span><select onchange="P.sexo=this.value"><option value="M" ${P.sexo=='M'?'selected':''}>Masculino</option><option value="F" ${P.sexo=='F'?'selected':''}>Feminino</option></select></div></div>
<span class="lb">Nível de atividade</span><select onchange="P.ativ=+this.value">${ACT.map(a=>`<option value="${a[0]}" ${P.ativ==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>
<span class="lb">Objetivo</span><select onchange="P.obj=this.value"><option value="perder" ${P.obj=='perder'?'selected':''}>Perder gordura</option><option value="manter" ${P.obj=='manter'?'selected':''}>Manter / recompor</option><option value="ganhar" ${P.obj=='ganhar'?'selected':''}>Ganhar massa</option></select>
<button class="btn" style="width:100%" onclick="sc=1;pick=-1;R()">Gerar cenários com IA</button>${DT.length?'<button class="btn t" style="width:100%" onclick="dnew=false;R()">Cancelar</button>':''}</div>
${sc?g.map(s=>`<div class="card sc ${pick==s.i?'on':''}" onclick="pick=${s.i};R()"><div class="d-flex justify-content-between"><b>${s.n}</b>${s.o==P.obj?'<span class="mut">recomendado</span>':''}</div><div class="big">${s.k} kcal</div><div class="mut" style="color:inherit">P ${s.p}g · C ${s.c}g · G ${s.g}g · fibras ${s.fib}g</div><div class="mini">Variação estimada: ${s.w>0?'+':''}${s.w} kg/semana</div></div>`).join('')+(pick>=0?'<button class="btn" style="width:100%" onclick="applyD()">Aplicar esta dieta</button>':'')+'<p class="mini">IA simulada no mockup (Mifflin-St Jeor + regras da ISSN).</p>':''}`}
vD=()=>{if(dnew||!DT.length)return dForm();const d=DT[di],s=d.s,k=s.meals.reduce((a,m,i)=>a+(d.eat[i]?m.kc:0),0),p=s.meals.reduce((a,m,i)=>a+(d.eat[i]?m.p:0),0);
return `<div class="card"><div class="d-flex justify-content-between align-items-center"><h2 style="margin:0">${s.n}</h2><button class="btn t btn-sm" onclick="delD()">Excluir</button></div><div class="big">${s.k} kcal</div><div class="mut">P ${s.p}g · C ${s.c}g · G ${s.g}g · fibras ${s.fib}g</div><div class="mini">Consumido ${k}/${s.k} kcal · proteína ${p}/${s.p} g</div></div>
<div class="card"><h2>Refeições de hoje</h2><table>${s.meals.map((m,i)=>`<tr><td><b>${m.n}</b><div class="mut">${m.f}</div><div class="mut">${m.kc} kcal · P${m.p} C${m.c} G${m.g}</div></td><td><button class="ck ${d.eat[i]?'on':''}" onclick="DT[${di}].eat[${i}]^=1;R()">✓</button></td></tr>`).join('')}</table></div>
<div class="card"><h2>Regras aplicadas</h2><div class="mini">• Déficit moderado (~20%) com piso calórico.<br>• Proteína de 1,8–2,2 g/kg em 5 refeições de 20–40 g.<br>• Ceia com caseína (30–40 g).<br>• Gordura mínima de 0,8 g/kg; carboidrato perto do treino.<br>• Fibras: 14 g a cada 1.000 kcal.<br>• Base: ISSN. Estimativa educativa, consulte um nutricionista.</div></div>`}
/* REMÉDIOS */
MED.forEach(m=>{m.times=m.h.split('·').map(x=>x.trim());m.days=[0,1,2,3,4,5,6];m.log={}});
function medSheet(i){const m=i>=0?MED[i]:{n:'',total:'',times:[],days:[0,1,2,3,4,5,6]};
openS(i>=0?'Editar remédio':'Novo remédio em '+DN[day],inp('mn','Nome e dosagem',m.n)+inp('mt','Total de doses do tratamento',m.total,'number')+inp('mh','Horários (separe por vírgula)',m.times.join(', '))+`<span class="lb">Dias da semana</span><div class="chips" style="display:flex;flex-wrap:wrap">${DN.map((d,k)=>`<button type="button" id="dd${k}" class="chip ${m.days.includes(k)?'on':''}" onclick="this.classList.toggle('on')">${d}</button>`).join('')}</div>`+(i>=0?`<button class="btn t dng" style="margin-top:16px" onclick="MED.splice(${i},1);closeS();R()">Excluir remédio</button>`:''),
()=>{const n=V('mn').trim(),t=+V('mt'),ds=DN.map((_,k)=>k).filter(k=>$('#dd'+k).classList.contains('on'));if(!n||!t||!ds.length)return;const tm=V('mh').split(',').map(x=>x.trim()).filter(Boolean);
const o=i>=0?MED[i]:{taken:0,log:{}};Object.assign(o,{n,total:t,times:tm.length?tm:['—'],days:ds});if(i<0)MED.push(o);closeS();R()})}
function tg(i,t){const m=MED[i],k=day+'_'+t;m.log[k]=!m.log[k];m.taken+=m.log[k]?1:-1;R()}
vS=()=>{const L=MED.map((m,i)=>[m,i]).filter(([m])=>m.days.includes(day));
return L.length?L.map(([m,i])=>{const r=m.total-m.taken,pd=m.times.length*m.days.length/7;return `<div class="card"><div class="d-flex justify-content-between align-items-center"><div><b>${m.n}</b><div class="mut">${m.days.length==7?'Todos os dias':m.days.map(d=>DN[d]).join(' · ')}</div></div><button class="btn t btn-sm" onclick="medSheet(${i})">⋯</button></div>
<div class="big">${r} <span class="mut">doses restantes</span></div><div class="bar"><b style="width:${m.taken/m.total*100}%"></b></div><div class="mini">${r?'~'+Math.ceil(r/pd)+' dias para terminar':'Tratamento concluído'}</div>
${m.times.map(t=>`<div class="d-flex justify-content-between align-items-center"><span>${t}</span><button class="ck ${m.log[day+'_'+t]?'on':''}" onclick="tg(${i},'${t}')">✓</button></div>`).join('')}</div>`}).join(''):`<div class="card"><h2>Sem remédios em ${DN[day]}</h2><div class="mut">Toque no + para agendar um remédio.</div></div>`}
/* TOPO */
const ctx0=ctx;
ctx=()=>{
if(tab=='f'){const sal=F.filter(f=>/sal[aá]rio/i.test(f.n)&&f.v>0&&cur>=f.a&&(f.b==null||cur<=f.b)).reduce((a,f)=>a+f.v,0);return ctx0().replace(brl(6500),brl(sal))}
if(tab=='d'){const pl=DT[di];const ch=DT.length?`<div class="chips dchips">${DT.map((d,i)=>`<button class="chip ${i==di&&!dnew?'on':''}" onclick="di=${i};dnew=false;R()">${d.name}</button>`).join('')}<button class="chip" onclick="newD()">+</button></div>`:'<div class="small text-muted">Crie sua primeira dieta com a IA.</div>';
if(!pl||dnew)return ch;const k=pl.s.meals.reduce((a,m,i)=>a+(pl.eat[i]?m.kc:0),0);return ch+`<div class="d-flex justify-content-between small"><b>${pl.s.n}</b><span class="text-muted">${k}/${pl.s.k} kcal</span></div><div class="bar"><b style="width:${Math.min(k/pl.s.k*100,100)}%"></b></div>`}
if(tab=='s'){const L=MED.filter(m=>m.days.includes(day)),tt=L.reduce((a,m)=>a+m.times.length,0),dn=L.reduce((a,m)=>a+m.times.filter(t=>m.log[day+'_'+t]).length,0);
return `<div class="chips">${DN.map((d,i)=>`<button class="chip ${i==day?'on':''}" onclick="day=${i};R()">${d}${i==new Date().getDay()?' •':''}</button>`).join('')}</div><div class="d-flex justify-content-between small text-muted"><span>${L.length} remédios</span><span>${dn}/${tt} doses</span></div>`}
return ctx0()}
R();
</script>

<script>

/* DIETA em modal */

function dietBody(){const g=gen(),fl=(l,k)=>`<div><span class="lb">${l}</span><input type="number" value="${P[k]}" onchange="P.${k}=+this.value"></div>`;
return `<div class="g2">${fl('Peso (kg)','peso')}${fl('Altura (cm)','altura')}${fl('Idade','idade')}<div><span class="lb">Sexo</span><select onchange="P.sexo=this.value"><option value="M" ${P.sexo=='M'?'selected':''}>Masculino</option><option value="F" ${P.sexo=='F'?'selected':''}>Feminino</option></select></div></div>
<span class="lb">Nível de atividade</span><select onchange="P.ativ=+this.value">${ACT.map(a=>`<option value="${a[0]}" ${P.ativ==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>
<span class="lb">Objetivo</span><select onchange="P.obj=this.value"><option value="perder" ${P.obj=='perder'?'selected':''}>Perder gordura</option><option value="manter" ${P.obj=='manter'?'selected':''}>Manter / recompor</option><option value="ganhar" ${P.obj=='ganhar'?'selected':''}>Ganhar massa</option></select>
<button class="btn" style="width:100%" onclick="sc=1;pick=-1;dRe()">Gerar cenários com IA</button>
${sc?g.map(s=>`<div class="card sc ${pick==s.i?'on':''}" onclick="pick=${s.i};dRe()"><div class="d-flex justify-content-between"><b>${s.n}</b>${s.o==P.obj?'<span class="mut">recomendado</span>':''}</div><div class="big">${s.k} kcal</div><div class="mut" style="color:inherit">P ${s.p}g · C ${s.c}g · G ${s.g}g</div><div class="mini">${s.w>0?'+':''}${s.w} kg/semana</div></div>`).join(''):''}`}
function dietSheet(){sc=null;pick=-1;openS('Nova dieta',dietBody(),applyD,'Aplicar dieta')}
applyD=function(){if(pick<0)return;DT.push({name:'Dieta '+(DT.length+1),s:gen()[pick],eat:{}});di=DT.length-1;sc=null;pick=-1;closeS();R()};
const vD2=vD;
vD=()=>DT.length?vD2():'<div class="card"><h2>Nenhuma dieta ainda</h2><div class="mut">Toque no + para criar sua dieta com a IA.</div></div>';
/* FINANCEIRO enxuto */
const vF2=vF;
vF=()=>vF2().replace(/<div style="font-size:12px">Saldo projetado[\s\S]*?<\/div>/,'').replace(/<button class="btn t btn-sm" onclick="openS\('Saldo[\s\S]*?Editar saldo<\/button>/,'').replace('Contas ativas','Entradas e saídas');
const ctx2=ctx;
ctx=()=>{if(tab=='f'){const x=fin();return `<div class="d-flex justify-content-between align-items-center"><button class="btn t btn-sm" onclick="cur--;R()">‹</button><b>${x.lbl}</b><span class="badge ${x.r>=0?'ok':'bad'}">${x.r>=0?'Lucro':'Prejuízo'} ${brl(x.r)}</span><button class="btn t btn-sm" onclick="cur++;R()">›</button></div>`}
if(tab=='d')return ctx2().replace('<button class="chip" onclick="newD()">+</button>','').replace('Crie sua primeira dieta com a IA.','Nenhuma dieta ainda.');return ctx2()};

<script>
/* DIETA única */
